<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <nav class="navbar">
        <div class="nav-left">daily marks</div>
        <div class="nav-right">
            <div class="settings-dropdown">
                <button class="settings-btn" id="settingsBtn">Welcome ▾</button>
                <div class="dropdown-menu" id="settingsMenu">
                    <a href="#" class="dropdown-item" id="openSettings">⚙️ Settings</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <div class="month-header" id="monthHeader"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr id="daysRow">
                        <th class="habit-col">Habits</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div>
            <button id="add-habit">+ Add Habit</button>
        </div>

        <!-- progress chart -->
        <div class="chart-section" id="chartSection">
            <h3 class="chart-title">Daily Progress</h3>
            <div class="chart-container">
                <canvas id="progressChart"></canvas>
            </div>
        </div>

    </div>
    </div>

    <!-- settings popup modal -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-popup">
            <div class="settings-popup-header">
                <h3>Settings</h3>
                <button class="settings-popup-close" id="settingsClose">✕</button>
            </div>
            <div class="settings-popup-content">
                <div class="setting-item">
                    <label>Stamp Mode</label>
                    <button id="stamp-mode-toggle" class="btn-secondary">Switch to Simple Mode</button>
                    <p class="setting-description">Simple mode: Click to instantly toggle stamp. Manual mode: Open popup
                        to place stamp precisely.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- stamp popup overlay -->
    <div class="stamp-overlay" id="stampOverlay">
        <div class="stamp-popup" id="stampPopup">
            <div class="stamp-popup-header">
                <div class="stamp-popup-meta">
                    <div class="stamp-popup-habit" id="popupHabitName">-</div>
                    <div class="stamp-popup-date" id="popupDate">-</div>
                </div>
                <button class="stamp-popup-close" id="popupClose">✕</button>
            </div>

            <!-- stamp canvas -->
            <div class="stamp-canvas-area" id="stampCanvas">
                <div class="canvas-hint" id="canvasHint">
                    <div class="hint-icon">💡</div>
                    <div class="hint-text">Click anywhere to place your stamp</div>
                </div>
            </div>

            <!-- actions -->
            <div class="stamp-popup-actions">
                <button class="btn-primary" id="popupSave">Save</button>
                <button class="btn-secondary" id="popupClear">Clear</button>
                <button class="btn-danger" id="popupDelete">Remove</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
