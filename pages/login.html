<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Daily Marks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="logo">
            <img src="../images/ok.png" alt="Daily Marks">
            <h1>Daily Marks</h1>
            <p class="subtitle">Sign in to track your habits</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="authForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password" minlength="6">
            </div>

            <button type="submit" class="btn" id="submitBtn">Sign In</button>
        </form>

        <div class="toggle-text">
            <span id="toggleText">Don't have an account? <a href="#" id="toggleLink">Sign up</a></span>
        </div>

        <div class="back-link">
            <a href="landing.html">← Back to home</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="../scripts/firebase-config.js"></script>
    <script src="../scripts/auth.js"></script>

    <script>
        let isSignUp = false;
        const form = document.getElementById('authForm');
        const submitBtn = document.getElementById('submitBtn');
        const toggleLink = document.getElementById('toggleLink');
        const toggleText = document.getElementById('toggleText');
        const errorMessage = document.getElementById('errorMessage');

        toggleText.addEventListener('click', (e) => {
            if (!e.target.matches('a')) return;
            e.preventDefault();
            isSignUp = !isSignUp;

            if (isSignUp) {
                submitBtn.textContent = 'Sign Up';
                toggleText.innerHTML = 'Already have an account? <a href="#" id="toggleLink">Sign in</a>';
            } else {
                submitBtn.textContent = 'Sign In';
                toggleText.innerHTML = 'Don\'t have an account? <a href="#" id="toggleLink">Sign up</a>';
            }

            errorMessage.classList.remove('show');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Loading...';
            errorMessage.classList.remove('show');

            try {
                if (isSignUp) {
                    await signUp(email, password);
                } else {
                    await signIn(email, password);
                }

                window.location.href = '../index.html';
            } catch (error) {
                let message = error.message;

                if (error.code === 'auth/email-already-in-use') {
                    message = 'This email is already registered. Please sign in.';
                } else if (error.code === 'auth/weak-password') {
                    message = 'Password should be at least 6 characters.';
                } else if (error.code === 'auth/invalid-email') {
                    message = 'Please enter a valid email address.';
                } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    message = 'Invalid email or password.';
                }

                errorMessage.textContent = message;
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = isSignUp ? 'Sign Up' : 'Sign In';
            }
        });

        auth.onAuthStateChanged((user) => {
            if (user && !window.location.search.includes('logout')) {
                window.location.href = '../index.html';
            }
        });

        // Auto-switch to sign up mode if #signup hash is present
        if (window.location.hash === '#signup') {
            isSignUp = true;
            submitBtn.textContent = 'Sign Up';
            toggleText.innerHTML = 'Already have an account? <a href="#" id="toggleLink">Sign in</a>';
        }
    </script>
</body>

</html>
